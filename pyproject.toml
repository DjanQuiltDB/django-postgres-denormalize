[build-system]
# The PEP 639 license expression below needs 77, which is also new enough not to want `wheel` declared here.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-postgres-denormalize"
dynamic = ["version"]
description = "Trigger-maintained copies of ancestor columns for Django on PostgreSQL."
readme = "README.rst"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "DjanQuiltDB Project", email = "djanquiltdb@portal42.net" },
]
keywords = [
    "django",
    "database",
    "postgresql",
    "denormalization",
    "triggers",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "django>=6.0,<7.0",
    "django-pgtrigger>=4.17,<5",
]

[project.urls]
Homepage = "https://github.com/djanquiltdb/django-postgres-denormalize"
Documentation = "https://django-postgres-denormalize.readthedocs.io/"
Source = "https://github.com/djanquiltdb/django-postgres-denormalize"
Issues = "https://github.com/djanquiltdb/django-postgres-denormalize/issues"
Changelog = "https://github.com/djanquiltdb/django-postgres-denormalize/blob/master/CHANGELOG.rst"

[project.optional-dependencies]
lint = [
    "ruff==0.15.21",
]
test = [
    "coverage",
    "psycopg[binary]>=3.0.0",
    "dj-database-url",
]
docs = [
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3.1,<4",
    # autodoc imports postgres_denormalize.triggers, and importing django-pgtrigger needs a PostgreSQL driver.
    "psycopg[binary]>=3.0.0",
]
dev = [
    "django-postgres-denormalize[test,lint,docs]",
    "pre-commit",
    # Native TOML configuration, so that tox.ini is not needed, landed in 4.21.
    "tox>=4.21",
    "build",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "postgres_denormalize.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The marker is what makes the inline annotations visible to a consumer's type checker.
postgres_denormalize = ["py.typed"]

[tool.tox]
requires = ["tox>=4.21"]
# Each Django the classifiers claim gets its own leg. A range wide enough to cover both would silently resolve to the
# newest one and leave the older claim untested, so every dj-- factor is pinned to exactly the minor it names.
env_list = [
    "py314-dj60-pg17",
    "py314-dj60-pg18",
    "py314-dj61-pg17",
    "py314-dj61-pg18",
    "ruff",
    "docs",
]

[tool.tox.env_run_base]
description = "Run the test suite against Postgres named by DATABASE_URL"
base_python = ["python3.14"]
package = "editable"
extras = ["test"]
change_dir = "tests"
pass_env = ["DATABASE_URL"]
set_env = { DJANGO_SETTINGS_MODULE = "config.settings", PYTHONWARNINGS = "default" }
commands = [
    [
        "coverage",
        "run",
        "--rcfile={tox_root}/pyproject.toml",
        "manage.py",
        "test",
        "--noinput",
        { replace = "posargs", extend = true, default = [] },
    ],
    ["coverage", "report", "--rcfile={tox_root}/pyproject.toml"],
]

[tool.tox.env.py314-dj60-pg17]
description = "Run the test suite against Django 6.0 and PostgreSQL 17"
deps = ["Django>=6.0,<6.1"]
set_env = { DJANGO_SETTINGS_MODULE = "config.settings", PYTHONWARNINGS = "default", DATABASE_URL = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres17:5432/test_db}" }

[tool.tox.env.py314-dj60-pg18]
description = "Run the test suite against Django 6.0 and PostgreSQL 18"
deps = ["Django>=6.0,<6.1"]
set_env = { DJANGO_SETTINGS_MODULE = "config.settings", PYTHONWARNINGS = "default", DATABASE_URL = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres18:5432/test_db}" }

[tool.tox.env.py314-dj61-pg17]
description = "Run the test suite against Django 6.1 and PostgreSQL 17"
deps = ["Django>=6.1,<6.2"]
set_env = { DJANGO_SETTINGS_MODULE = "config.settings", PYTHONWARNINGS = "default", DATABASE_URL = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres17:5432/test_db}" }

[tool.tox.env.py314-dj61-pg18]
description = "Run the test suite against Django 6.1 and PostgreSQL 18"
deps = ["Django>=6.1,<6.2"]
set_env = { DJANGO_SETTINGS_MODULE = "config.settings", PYTHONWARNINGS = "default", DATABASE_URL = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres18:5432/test_db}" }

[tool.tox.env.ruff]
description = "Lint and check formatting"
skip_install = true
extras = []
deps = ["ruff==0.15.21"]
change_dir = "{tox_root}"
commands = [
    ["ruff", "check", "src", "tests", "docs"],
    ["ruff", "format", "--check", "src", "tests", "docs"],
]

[tool.tox.env.docs]
description = "Build the documentation"
extras = ["docs"]
change_dir = "{tox_root}"
commands = [["sphinx-build", "-b", "html", "-W", "docs", "docs/_build/html"]]

[tool.tox.env.build]
description = "Build the sdist and wheel and check the metadata"
skip_install = true
extras = []
deps = ["build", "twine"]
change_dir = "{tox_root}"
commands = [
    # `build` leaves whatever is already in dist/ alone, and the twine check below globs the whole directory, so an
    # earlier version's artefacts would be checked here and uploaded by a later `twine upload dist/*`.
    ["python", "-c", "import shutil; shutil.rmtree('dist', ignore_errors=True)"],
    ["python", "-m", "build"],
    ["twine", "check", "dist/*"],
]

[tool.coverage.run]
source = ["postgres_denormalize"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 97
exclude_also = [
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    # isort
    "I",
    # docstrings and comments longer than max-doc-length
    "W505",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
