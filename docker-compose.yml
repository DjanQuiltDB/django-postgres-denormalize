services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-denormalize-test
    volumes:
      - .:/app:z
      - /app/.ruff_cache
      - /app/.tox
      - /app/.venv
    command: tox
    depends_on:
      postgres17:
        condition: service_healthy
      postgres18:
        condition: service_healthy
    networks:
      - test-network

  postgres17:
    image: postgres:17
    container_name: postgres-denormalize-postgres17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test_db
    # django-postgres-objects publishes 5443 and 5445, so these sit beside them and both projects' databases can run
    # at once.
    ports:
      - "5447:5432"
    volumes:
      - postgres17-data:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres18:
    image: postgres:18
    container_name: postgres-denormalize-postgres18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test_db
    ports:
      - "5449:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres17-data:
  postgres18-data:

networks:
  test-network:
    driver: bridge
